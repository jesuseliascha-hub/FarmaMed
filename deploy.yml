name: Publicar Farmacopedia en GitHub Pages

# Se ejecuta automáticamente cada vez que subes cambios a la rama "main".
# No tienes que hacer nada manual: subir el cambio ya publica la app.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {} # también te permite publicarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio para GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar los archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
